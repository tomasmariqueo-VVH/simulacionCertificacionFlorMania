<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Tomás Mariqueo">
    <link rel="stylesheet" href="static/css/style.css">
    <title>FlorMania</title>
</head>

<body>
    <header class="header">
        <nav class="nav">
            <div class="izquierda">
                <div class="logo">
                    <h2><span>Flor</span>Manía</h2>
                </div>
            </div>
            <div class="derecha">
                <div class="links">
                    <a id="cambiante" href="#">Envía Flores</a>
                    <a href="#">Nosotros</a>
                </div>
                <div class="login">
                    <button id="sesion">Iniciar Sesión</button>
                </div>
            </div>
        </nav>
        <div class="secciones">
            <a href="#">Girasoles</a>
            <a href="#">Rosas</a>
            <a href="#">Claveles</a>
            <a href="#">Rosas</a>
            <a href="#">Orquídeas</a>
            <a href="#">Margaritas</a>
        </div>
    </header>
    <main class="main">
        <div class="principal">
            <h2>Flor del Mes</h2>
            <div class="contenedor-flor">
                <img src="static/images/flor-del-mes.jpg" alt="florDelMes">
            </div>
        </div>
        <div class="resultados">
            <div class="titulos">
                <div class="mostrar">
                    <h4>Mostrando <strong>50 resultados</strong></h4>
                </div>
                <div class="ver-mas">
                    <a href="#">Ver más Flores</a>
                </div>
            </div>
            <div class="seccion-resultados">
                <div class="resultado">
                    <div class="contenedor-img">
                        <img src="static/images/ramo-de-rosas.jpg" alt="imagenResultado">
                    </div>
                    <div class="inferior">
                        <div class="descripcion">
                            <p>Ramo de rosas</p>
                            <span>$40.00</span>
                        </div>
                        <div class="boton-compra">
                            <button id="boton1">Comprar</button>
                        </div>
                    </div>
                </div>

                <div class="resultado">
                    <div class="contenedor-img">
                        <img src="static/images/arreglo-tulipanes.jpg" alt="imagenResultado">
                    </div>
                    <div class="inferior">
                        <div class="descripcion">
                            <p>Arreglo Tulipanes</p>
                            <span>$50.00</span>
                        </div>
                        <div class="boton-compra">
                            <button id="boton2">Comprar</button>
                        </div>
                    </div>
                </div>

                <div class="resultado">
                    <div class="contenedor-img">
                        <img src="static/images/bouquet-lirios.jpg" alt="imagenResultado">
                    </div>
                    <div class="inferior">
                        <div class="descripcion">
                            <p>Bouquet Lirios</p>
                            <span>$25.00</span>
                        </div>
                        <div class="boton-compra">
                            <button id="boton3">Comprar</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer"></footer>
    <script src="static/js/script.js"></script>
</body>

</html>
